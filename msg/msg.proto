// SystemMsgVisibilityEntry: whether one system notification contentType
// is shown to clients on one exact PlatformID (1 iOS, 2 Android,
// 3 Windows, 4 OSX, 5 Web, 6 MiniWeb, 7 Linux, 8 APad, 9 IPad,
// 10 Admin, 11 HarmonyOS, 12 Bot). Keyed on the exact PlatformID rather
// than one of the coarser PlatformID2class buckets ("PC"/"Mobile"/
// "Pad"): an admin hiding group-created on Web must not silently also
// hide it on MiniWeb, and bucketing left iPad/HarmonyOS/Bot in no
// bucket at all.
//
// `show` is an ordinary bool with no third state. Every (contentType,
// platformID) pair the table covers is visible until an admin says
// otherwise, so a pair with no stored entry reads as show=true and the
// full matrix is always answerable. It was a tri-state once, where a
// missing entry meant "nobody has an opinion" and each client fell back
// to a default of its own — which spread the decision across as many
// places as there were clients, none of which matched what the admin
// console's matrix was drawing.
message SystemMsgVisibilityEntry {
  int32 contentType = 1;
  int32 platformID = 2;
  bool show = 3;
}

message SetSystemMsgVisibilityReq {
  repeated SystemMsgVisibilityEntry entries = 1;
}

message SetSystemMsgVisibilityResp {}

message DelSystemMsgVisibilityReq {
  // Only contentType and platformID are read; show is ignored. Deleting
  // an entry restores the default, which is show=true — the same state
  // Set with show=true describes, stored in the shorter way.
  repeated SystemMsgVisibilityEntry entries = 1;
}

message DelSystemMsgVisibilityResp {}

message GetSystemMsgVisibilityListReq {}

message GetSystemMsgVisibilityListResp {
  repeated SystemMsgVisibilityEntry entries = 1;
}

// Read the admin-configured client settings. Open to any signed-in user,
// unlike the two writes below: every client needs the answer at startup
// to know whether it may offer editing at all, and for how long.
message GetAppSettingsReq {}

message GetAppSettingsResp {
  // Always fully populated, defaults applied — see sdkws.AppSettings.
  sdkws.AppSettings settings = 1;
}

message SetAppSettingsReq {
  // Merged, not replaced: fields left absent keep their current values.
  sdkws.AppSettings settings = 1;
}

message SetAppSettingsResp {
  // The whole object as it now stands, so the caller that just wrote it
  // renders the same values every other client is about to be pushed,
  // rather than the subset it happened to send.
  sdkws.AppSettings settings = 1;
}

// EditMsgReq rewrites one message in place, at the same seq.
//
// Not ModifyMessage above, which is an upstream stub with no
// implementation on any server in this deployment: its request carries
// no contentType, so it cannot express the one edit that changes it
// (adding an @mention turns Text into AtText), and adopting its name for
// different semantics would collide the day upstream fills it in.
message EditMsgReq {
  string conversationID = 1;
  int64 seq = 2;
  // The editor, who must also be the message's original sender. There is
  // deliberately no moderator path: taking down someone else's message
  // and rewriting their words are different acts, and only the first is
  // moderation.
  string userID = 3;
  // The new payload, already encoded for contentType — the same bytes
  // that would have been sent had the message been written this way in
  // the first place. Encoded by the client because that is where the
  // knowledge lives: rebuilding an AtText's atUserList from plain text
  // would mean re-deriving the mention list on the server from a name
  // table it does not have.
  string content = 4;
  // The new content type, which may differ from the old one within the
  // text family (Text, AtText, AdvancedText, MarkdownText). Anything
  // else is refused.
  int32 contentType = 5;
}

message EditMsgResp {
  int64 editTime = 1;
}

// GetMsgExtraVersionReq asks whether anything in a conversation's message
// history has been changed in place since the caller last checked.
//
// A client's local message cache is a snapshot, and three operations
// rewrite history underneath it after the fact: a recall, an edit, and a
// physical delete. Each is pushed as a notification too, but a
// notification only reaches a client that is connected to receive it —
// measured, a recall made while the recipient was offline never reached
// their cache by any route at all, and the original wording stayed on
// their disk with nothing in the system able to correct it.
//
// So this is the durable counterpart to those notifications: a single
// monotonic counter per conversation, bumped by every in-place change.
// It says only *that* something changed, never what. The client compares
// it against what it stored, and if they differ re-reads the messages it
// is actually holding — the message itself is where the new content
// lives, and every read path materialises a recall on the way out.
//
// Deliberately a counter and not a change log. A log keyed by seq would
// grow one entry per distinct message ever changed, without bound, and
// the existing VersionLog infrastructure keeps exactly one entry per
// distinct element id forever — fine for friends or group members, whose
// id sets have a natural ceiling, fatal for messages, whose set does not.
// A counter also self-heals: a bump that fails to be written is picked up
// by the next change in the same conversation, where a lost log entry
// would simply be lost.
message GetMsgExtraVersionReq {
  string userID = 1;
  string conversationID = 2;
}

message GetMsgExtraVersionResp {
  // 0 when nothing in this conversation has ever been changed in place —
  // the same value a client starts from, so an untouched conversation
  // costs nothing beyond this call.
  int64 version = 1;
}

// Scheduled messages: written now, sent by the server later under their
// owner's name — whether or not any of the owner's devices are online.
// Nobody but the owner can see one before it is sent.

// How a recurring scheduled message repeats. hour:minute is a wall-clock
// time in the schedule's timeZone, so "09:00 every day" stays 09:00 across
// daylight-saving changes rather than drifting by an hour.
message ScheduledMsgRecurrence {
  // constant.ScheduledMsgDaily / Weekly / Monthly.
  int32 frequency = 1;
  // Weekly only: 0 Sunday … 6 Saturday, at least one.
  repeated int32 weekdays = 2;
  // Monthly only: 1–31. A month with fewer days sends on its last day.
  int32 monthDay = 3;
  int32 hour = 4;
  int32 minute = 5;
  // constant.ScheduledMsgEndNever / EndUntil / EndCount.
  int32 endType = 6;
  // EndUntil only: "YYYY-MM-DD" in timeZone, inclusive.
  string untilDate = 7;
  // EndCount only: 1–365 successful sends. Skipped occurrences do not count.
  int32 count = 8;
}

// When a scheduled message goes out.
//
// One-time: sendAt is the instant, and timeZone plus localTime are what
// the owner picked it as — kept so another device can say "09:00 Vietnam
// time" without redoing timezone arithmetic of its own.
//
// Recurring: recurrence is set, sendAt is ignored on a write (the server
// works out the first occurrence), and timeZone is the zone the rule's
// wall-clock times are in.
message ScheduledMsgSchedule {
  int64 sendAt = 1;
  // IANA name, e.g. "Asia/Ho_Chi_Minh". Required.
  string timeZone = 2;
  // One-time only: "YYYY-MM-DDTHH:mm" as picked, in timeZone.
  string localTime = 3;
  ScheduledMsgRecurrence recurrence = 4;
}

message ScheduledMsg {
  string scheduleID = 1;
  string conversationID = 2;
  // The message as it will be sent. content is re-sent verbatim; sendTime,
  // serverMsgID and seq are assigned when it actually goes out.
  sdkws.MsgData msgData = 3;
  ScheduledMsgSchedule schedule = 4;
  // The next time it will be sent: the one-time instant, or a recurring
  // schedule's next occurrence. Unchanged once a message has ended.
  int64 sendAt = 5;
  // constant.ScheduledMsgPending … ScheduledMsgCompleted.
  int32 status = 6;
  // Failed only: the error code that ended it (a servererrs code) and why.
  int32 failCode = 7;
  string failReason = 8;
  // Recurring only.
  int32 sentCount = 9;
  int64 lastSentAt = 10;
  // constant.ScheduledMsgResult*: what happened the last time it came due.
  int32 lastResult = 11;
  int64 createTime = 12;
  int64 updateTime = 13;
}

message CreateScheduledMsgReq {
  // sendID must be the caller. Text, AtText and Quote only.
  sdkws.MsgData msgData = 1;
  ScheduledMsgSchedule schedule = 2;
}
message CreateScheduledMsgResp {
  ScheduledMsg scheduledMsg = 1;
}

// Pending messages only. Either part may be left out to keep it; the
// conversation a message goes to cannot change.
message UpdateScheduledMsgReq {
  string scheduleID = 1;
  sdkws.MsgData msgData = 2;
  ScheduledMsgSchedule schedule = 3;
}
message UpdateScheduledMsgResp {
  ScheduledMsg scheduledMsg = 1;
}

// Pending or failed messages: a pending one will not be sent, a failed one
// leaves the owner's list.
message CancelScheduledMsgReq {
  string scheduleID = 1;
}
message CancelScheduledMsgResp {}

// Sends now instead of waiting. A one-time message is then done; a
// recurring one sends an extra copy and keeps its schedule.
message SendScheduledMsgNowReq {
  string scheduleID = 1;
}
message SendScheduledMsgNowResp {
  ScheduledMsg scheduledMsg = 1;
}

// The caller's pending, sending and failed messages, soonest first —
// in one conversation, or across all of them when conversationID is empty.
message GetScheduledMsgsReq {
  string conversationID = 1;
  sdkws.RequestPagination pagination = 2;
}
message GetScheduledMsgsResp {
  repeated ScheduledMsg scheduledMsgs = 1;
  int32 total = 2;
}

// Admin only. Cancels everything a user has scheduled that has not gone
// out yet — for an account being blocked or removed, whose messages must
// not keep arriving under their name.
message CancelUserScheduledMsgsReq {
  string userID = 1;
}
message CancelUserScheduledMsgsResp {
  int32 count = 1;
}

service msg {
  // Get min and max seq (including the user and specified groups)
  rpc GetMaxSeq(sdkws.GetMaxSeqReq) returns (sdkws.GetMaxSeqResp);
  // Get the max seq for the conversation list
  rpc GetMaxSeqs(GetMaxSeqsReq) returns (SeqsInfoResp);
  // Get the max read seq for the conversation list
  rpc GetHasReadSeqs(GetHasReadSeqsReq) returns (SeqsInfoResp);
  // Get the newest message
  rpc GetMsgByConversationIDs(GetMsgByConversationIDsReq) returns (GetMsgByConversationIDsResp);
  rpc GetConversationMaxSeq(GetConversationMaxSeqReq) returns (GetConversationMaxSeqResp);
  // Pull historical messages (including the user and specified groups)
  rpc PullMessageBySeqs(sdkws.PullMessageBySeqsReq) returns (sdkws.PullMessageBySeqsResp);
  rpc GetSeqMessage(GetSeqMessageReq) returns (GetSeqMessageResp);
  // Admin console only — see SearchMessageReq.
  rpc SearchMessage(SearchMessageReq) returns (SearchMessageResp);
  // Keyword search a user runs on their own history, in one conversation
  // or across all of them.
  rpc SearchMessages(SearchMessagesReq) returns (SearchMessagesResp);
  // Send message
  rpc SendMsg(SendMsgReq) returns (SendMsgResp);
  // Send message with simplified request
  rpc SendSimpleMsg(SendSimpleMsgReq) returns (SendSimpleMsgResp);

  rpc SetUserConversationsMinSeq(SetUserConversationsMinSeqReq) returns (SetUserConversationsMinSeqResp);

  // Clear all messages for the specified conversations and reset the min seq to max seq + 1
  rpc ClearConversationsMsg(ClearConversationsMsgReq) returns (ClearConversationsMsgResp);
  // Delete all messages for the user and reset the min seq to max seq + 1
  rpc UserClearAllMsg(UserClearAllMsgReq) returns (UserClearAllMsgResp);
  // Mark selective message deletion by seq for the user
  rpc DeleteMsgs(DeleteMsgsReq) returns (DeleteMsgsResp);
  // Physically delete messages by seq
  rpc DeleteMsgPhysicalBySeq(DeleteMsgPhysicalBySeqReq) returns (DeleteMsgPhysicalBySeqResp);
  // Physically delete messages by timestamp
  rpc DeleteMsgPhysical(DeleteMsgPhysicalReq) returns (DeleteMsgPhysicalResp);

  // Set whether the API-sent message was delivered successfully
  rpc SetSendMsgStatus(SetSendMsgStatusReq) returns (SetSendMsgStatusResp);
  // Get the message delivery status
  rpc GetSendMsgStatus(GetSendMsgStatusReq) returns (GetSendMsgStatusResp);
  rpc RevokeMsg(RevokeMsgReq) returns (RevokeMsgResp);
  // mark as read
  rpc MarkMsgsAsRead(MarkMsgsAsReadReq) returns (MarkMsgsAsReadResp);
  rpc MarkConversationAsRead(MarkConversationAsReadReq) returns (MarkConversationAsReadResp);
  rpc SetConversationHasReadSeq(SetConversationHasReadSeqReq) returns (SetConversationHasReadSeqResp);
  // Per-message read-receipt counts for a batch of seqs already in the local
  // cache (e.g. on initial load / page-in of history) — the live/incremental
  // path is the seqReadCounts pushed on sdkws.MarkAsReadTips instead.
  rpc GetMessagesReadCount(GetMessagesReadCountReq) returns (GetMessagesReadCountResp);
  // Paginated list of who has read one specific message (userID + readAt),
  // ordered most-recent-read first. Meant to be called lazily, only once the
  // user actually opens the "seen by" detail view for that message.
  rpc GetMessageReaders(GetMessageReadersReq) returns (GetMessageReadersResp);
  // Pinned messages: pin/unpin one, clear the lot, and sync the list by
  // version. See PinnedMessageChangedTips for how a change reaches
  // everyone else.
  rpc PinMessage(PinMessageReq) returns (PinMessageResp);
  rpc ClearPinnedMessages(ClearPinnedMessagesReq) returns (ClearPinnedMessagesResp);
  rpc GetPinnedMessages(GetPinnedMessagesReq) returns (GetPinnedMessagesResp);

  rpc GetConversationsHasReadAndMaxSeq(GetConversationsHasReadAndMaxSeqReq) returns (GetConversationsHasReadAndMaxSeqResp);
  rpc GetActiveUser(GetActiveUserReq) returns (GetActiveUserResp);
  rpc GetActiveGroup(GetActiveGroupReq) returns (GetActiveGroupResp);
  rpc GetServerTime(GetServerTimeReq) returns (GetServerTimeResp);

  rpc ClearMsg(ClearMsgReq) returns (ClearMsgResp);
  rpc DestructMsgs(DestructMsgsReq) returns (DestructMsgsResp);

  rpc GetActiveConversation(GetActiveConversationReq) returns (GetActiveConversationResp);
  
  rpc SetUserConversationMaxSeq(SetUserConversationMaxSeqReq) returns (SetUserConversationMaxSeqResp);
  rpc SetUserConversationMinSeq(SetUserConversationMinSeqReq) returns (SetUserConversationMinSeqResp);
  rpc GetLastMessageSeqByTime(GetLastMessageSeqByTimeReq) returns (GetLastMessageSeqByTimeResp);
  rpc GetLastMessage(GetLastMessageReq) returns (GetLastMessageResp);

  rpc AppendStreamMsg(AppendStreamMsgReq) returns (AppendStreamMsgResp);
  rpc GetStreamMsg(GetStreamMsgReq) returns (GetStreamMsgResp);
  rpc ModifyMessage(ModifyMessageReq) returns (ModifyMessageResp);

  // Admin-configured show/hide table for the system notifications that
  // render as a line inside a chat transcript. Owned here rather than in
  // the sibling `chat` business server because both keys are this
  // protocol's own enums (contentType and PlatformID) and only
  // open-im-server ever reads the result — see
  // SystemMsgVisibilityEntry above. Writes go to Mongo, then push a
  // snapshot into Redis and publish on cachekey.SystemMsgVisibilityChannel
  // so msggateway (which has no Mongo of its own) and this service both
  // refresh their in-memory caches without polling anything.
  rpc SetSystemMsgVisibility(SetSystemMsgVisibilityReq) returns (SetSystemMsgVisibilityResp);
  rpc DelSystemMsgVisibility(DelSystemMsgVisibilityReq) returns (DelSystemMsgVisibilityResp);
  rpc GetSystemMsgVisibilityList(GetSystemMsgVisibilityListReq) returns (GetSystemMsgVisibilityListResp);

  // Admin-configured client settings, owned here for the same reason the
  // visibility table above is: msg is the service that has to *enforce*
  // them (the edit and recall windows are checked on the write path), and
  // a check on the write path must never wait on another service to
  // answer. Same propagation, too — Mongo, then a snapshot into Redis
  // published on cachekey.AppSettingsChannel — so enforcing a window
  // costs no database read per message.
  rpc GetAppSettings(GetAppSettingsReq) returns (GetAppSettingsResp);
  rpc SetAppSettings(SetAppSettingsReq) returns (SetAppSettingsResp);

  // Edit a message in place — see EditMsgReq for why this is not the
  // ModifyMessage stub above.
  rpc EditMsg(EditMsgReq) returns (EditMsgResp);

  // Has anything in this conversation been rewritten in place since the
  // caller last looked? See GetMsgExtraVersionReq.
  rpc GetMsgExtraVersion(GetMsgExtraVersionReq) returns (GetMsgExtraVersionResp);

  // Scheduled messages — see ScheduledMsg. Every call but the last acts on
  // the caller's own messages only.
  rpc CreateScheduledMsg(CreateScheduledMsgReq) returns (CreateScheduledMsgResp);
  rpc UpdateScheduledMsg(UpdateScheduledMsgReq) returns (UpdateScheduledMsgResp);
  rpc CancelScheduledMsg(CancelScheduledMsgReq) returns (CancelScheduledMsgResp);
  rpc SendScheduledMsgNow(SendScheduledMsgNowReq) returns (SendScheduledMsgNowResp);
  rpc GetScheduledMsgs(GetScheduledMsgsReq) returns (GetScheduledMsgsResp);
  rpc CancelUserScheduledMsgs(CancelUserScheduledMsgsReq) returns (CancelUserScheduledMsgsResp);
}
