// One pinned message. `message` is the message itself, so a pinned bar
// can render its digest without a second fetch — absent when the message
// can no longer be read (physically removed, or below this user's floor).
message PinnedMessage {
  int64 seq = 1;
  string clientMsgID = 2;
  string pinnedBy = 3;
  int64 pinTime = 4;
  openim.sdkws.MsgData message = 5;
}

// Pin or unpin one message. Both directions share an RPC because they
// share every check; the REST layer offers them as two routes.
message PinMessageReq {
  string conversationID = 1;
  string userID = 2;
  int64 seq = 3;
  bool pin = 4;
}
message PinMessageResp {
  int64 version = 1;
}

message ClearPinnedMessagesReq {
  string conversationID = 1;
  string userID = 2;
}
message ClearPinnedMessagesResp {
  int64 version = 1;
}

// Sync by version: pass the version last seen and get `unchanged` back
// when nothing has moved, so opening a conversation costs one small
// round trip rather than a list.
message GetPinnedMessagesReq {
  string conversationID = 1;
  string userID = 2;
  int64 version = 3;
}
message GetPinnedMessagesResp {
  int64 version = 1;
  bool unchanged = 2;
  repeated PinnedMessage messages = 3;
}

message GetMessagesReadCountReq {
  string conversationID = 1;
  repeated int64 seqs = 2;
  string userID = 3;
}

// seq -> number of distinct readers other than the message's own sender.
// A seq with no reads yet (or not found) is simply absent from the map.
message GetMessagesReadCountResp {
  map<int64, int32> readCounts = 1;
}

message GetMessageReadersReq {
  string conversationID = 1;
  int64 seq = 2;
  // 0 = start from the most recently read; otherwise the readAt (unix milli)
  // of the last entry from the previous page, for descending keyset paging.
  int64 lastReadAt = 3;
  int32 count = 4;
  string userID = 5;
}

message MessageReader {
  string userID = 1;
  int64 readAt = 2;
}

message GetMessageReadersResp {
