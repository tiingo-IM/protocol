}

message BlackInfo {
  string ownerUserID = 1;
  int64 createTime = 2;
  PublicUserInfo blackUserInfo = 3;
  int32 addSource = 4;
  string operatorUserID = 5;
  string ex = 6;
}

message GroupRequest {
  PublicUserInfo userInfo = 1;
  GroupInfo groupInfo = 2;
  int32 handleResult = 3;
  string reqMsg = 4;
  string handleMsg = 5;
  int64 reqTime = 6;
  string handleUserID = 7;
  int64 handleTime = 8;
  string ex = 9;
  int32 joinSource = 10;
  string inviterUserID = 11;
}

message FriendRequest {
  string fromUserID = 1;
  string fromNickname = 2;
  string fromFaceURL = 3;
  string toUserID = 4;
  string toNickname = 5;
  string toFaceURL = 6;
  int32 handleResult = 7;
  string reqMsg = 8;
  int64 createTime = 9;
  string handlerUserID = 10;
  string handleMsg = 11;
  int64 handleTime = 12;
  string ex = 13;
}

///////////////////////////////////base end/////////////////////////////////////
enum PullOrder {
  PullOrderAsc = 0;
  PullOrderDesc = 1;
}
message PullMessageBySeqsReq {
  string userID = 1;
  repeated SeqRange seqRanges = 2;
  PullOrder order = 3;
}

message SeqRange {
  string conversationID = 1;
  int64 begin = 2;
  int64 end = 3;
  int64 num = 4;
}

message PullMsgs {
  repeated MsgData Msgs = 1;
  bool isEnd = 2;
  int64 endSeq = 3;
}

message PullMessageBySeqsResp {
  map<string, PullMsgs> msgs = 1;
  map<string, PullMsgs> notificationMsgs = 2;
}

message GetMaxSeqReq {
  string userID = 1;
}

message GetMaxSeqResp {
  map<string, int64> maxSeqs = 1;
  map<string, int64> minSeqs = 2;
}

message UserSendMsgResp {
  string serverMsgID = 1;
  string clientMsgID = 2;
  int64 sendTime = 3;
}

message MsgData {
  string sendID = 1;
  string recvID = 2;
  string groupID = 3;
  string clientMsgID = 4;
  string serverMsgID = 5;
  int32 senderPlatformID = 6;
  string senderNickname = 7;
  string senderFaceURL = 8;
  int32 sessionType = 9;
  int32 msgFrom = 10;
  int32 contentType = 11;
  bytes content = 12;
  int64 seq = 14;
  int64 sendTime = 15;
  int64 createTime = 16;
  int32 status = 17;
  bool isRead = 18;
  map<string, bool> options = 19;
  OfflinePushInfo offlinePushInfo = 20;
  repeated string atUserIDList = 21;
  string attachedInfo = 22;
  string ex = 23;
  // Local extension, not part of upstream openimsdk/protocol: the
  // resolved, per-recipient-device answer to whether this specific
  // delivery of a system/notification message (msgFrom=Sys) should be
  // shown to the client at all — read from the admin-configured
  // (contentType, platformID) visibility table that openim-server owns
  // (see msg.SystemMsgVisibilityEntry).
  //
  // Carries an answer, not an override. Every contentType the table
  // covers resolves to true or false on every platform — true being the
  // default, until an admin says otherwise — and this field is set
  // either way. Absent means only that the contentType is not one the
  // table has any opinion about, and the client decides for itself
  // whether to render it.
  //
  // Still `optional` even though it is always populated for a covered
  // type: proto3 does not put a plain bool on the wire when it is
  // false, so a non-optional field could never have carried "hide" at
  // all — the one value that matters.
  //
  // Populated in two places, both keyed on the receiving device's exact
  // PlatformID (openimsdk/protocol's own ID, not one of the coarser
  // PC/Mobile/Pad classes): msggateway at the moment it writes to one
  // specific connection (internal/msggateway/hub_server.go's
  // pushToUser), and the msg RPC's sync/pull responses, keyed on the
  // requesting session's platform (internal/rpc/msg/sync_msg.go) — so a
  // message recovered by sync rather than seen live carries the same
  // decision. It is never persisted: the stored message has no single
  // receiving device to resolve against, so the value is always
  // computed per delivery.
  optional bool systemMsgVisible = 24;
  // When this message was last edited by its author, in epoch ms, or 0
  // if it never was. One field rather than an is_edited flag beside a
  // timestamp: two fields can contradict each other (edited=true with no
  // time, a time with edited=false) and one cannot, and a real edit time
  // is always non-zero, so the sentinel costs nothing.
  //
  // Editing rewrites the message in place at the same seq — there is no
  // second message and no gap in the sequence — so a client syncing
  // history it missed receives the edited content with no special
  // handling at all, and this field is what tells it to render the
  // "edited" marker beside the timestamp.
  int64 editTime = 25;
  // Whether the user this response is being built *for* has already read
  // this specific message — resolved per delivery against the durable
  // per-message read-receipt claim set, never persisted with the message
  // (it has no single reader to resolve against). Lets a client skip
  // re-reporting a message it already reported, which the previous
  // in-memory-only guard could not survive a restart to do.
  //
  // Deliberately NOT the neighbouring isRead field, which is a different
  // question with the opposite subject: isRead means "the *peer* read the
  // message I sent" (a receipt, single-chat only — see the server's
  // convert.MsgDB2Pb), whereas this means "I read the message someone
  // sent me".
  //
  // Not `optional`: absent (an older server) and an explicit false lead
  // to the same client action — report it — so presence would carry no
  // information a client could act on differently.
  bool readByMe = 26;
}
message PushMessages {
  map<string, PullMsgs> msgs = 1;
  map<string, PullMsgs> notificationMsgs = 2;
}
message OfflinePushInfo {
  string title = 1;
  string desc = 2;
  string ex = 3;
  string iOSPushSound = 4;
  bool iOSBadgeCount = 5;
  string signalInfo = 6;
}

message TipsComm {
