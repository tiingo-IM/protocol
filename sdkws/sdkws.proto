syntax = "proto3";
package openim.sdkws;

import "wrapperspb/wrapperspb.proto";

option go_package = "github.com/openimsdk/protocol/sdkws";

////////////////////////////////base///////////////////////////////

message GroupInfo {
  string groupID = 1;
  string groupName = 2;
  string notification = 3;
  string introduction = 4;
  string faceURL = 5;
  string ownerUserID = 6;
  int64 createTime = 7;
  uint32 memberCount = 8;
  string ex = 9;
  int32 status = 10;
  string creatorUserID = 11;
  int32 groupType = 12;
  int32 needVerification = 13;
  int32 lookMemberInfo = 14;
  int32 applyMemberFriend = 15;
  int64 notificationUpdateTime = 16;
  string notificationUserID = 17;
  // The two owner-configurable switches below carry three states each,
  // not two: 0 = unset, 1 = on, 2 = off (constant.GroupSettingUnset /
  // On / Off). "No owner has ever answered" is a real answer — it is
  // what lets a deployment-wide default apply — and a bool cannot hold
  // it, since proto3 makes false and absent the same wire.

  // On: removing a member takes their own copy of the conversation with
  // it, rather than leaving them a read-only record of a group they are
  // no longer in. Only their copy; everything said stays put for
  // everyone still in the group. Unset behaves as on.
  int32 deleteConversationOnKick = 18;
  // On: someone who joins may read what was said before they arrived.
  // Enforced at the moment of joining, by pinning that member's floor
  // then — so turning it on later does not retroactively open the back
  // catalogue to people who joined while it was off, and turning it off
  // does not close history someone already has. Unset defers to the
  // deployment's enableHistoryForNewMembers.
  int32 historyForNewMembers = 19;
  // On: this group keeps and shows per-message read receipts — the
  // "seen by" list and the read count on each message. Off, nobody's
  // reading is recorded here and nothing already recorded is served.
  // Unset behaves as on, which is how the group behaved before the
  // switch existed.
  int32 readReceipts = 20;
  // On: ordinary members may pin and unpin messages here. Off, only the
  // owner and admins can, and everyone else sees the pinned bar without
  // being able to change it. Unset behaves as off — pinning puts
  // something in front of the whole group, so it starts as a
  // moderator's act.
  int32 memberPin = 21;
}

// A conversation's pinned-message list changed — pushed to everyone in
// the conversation so the pinned bar moves without a refetch, and, for a
// pin, also written into the timeline as a tip ("X pinned a message").
//
// `version` is the list's version *after* this change. A client holding
// the previous one knows its copy is exactly one change stale and can
// apply this tip directly; a client further behind refetches. See
// GetPinnedMessagesReq.
message PinnedMessageChangedTips {
  string conversationID = 1;
  int32 sessionType = 2;
  string groupID = 3;
  // constant.PinnedMessagePinned / Unpinned / Cleared.
  int32 action = 4;
  // The message pinned or unpinned; 0 when the whole list was cleared.
  int64 seq = 5;
  string opUserID = 6;
  string opUserNickname = 7;
  int64 version = 8;
}

message GroupInfoForSet {
  string groupID = 1;
  string groupName = 2;
  string notification = 3;
  string introduction = 4;
  string faceURL = 5;
  openim.protobuf.StringValue ex = 6;
  openim.protobuf.Int32Value needVerification = 7;
  openim.protobuf.Int32Value lookMemberInfo = 8;
  openim.protobuf.Int32Value applyMemberFriend = 9;
  // See GroupInfo above for what these mean. Wrapped, like the three
  // Int32Values above them, so that "not in this request" stays
  // distinct from "set it to 0".
  openim.protobuf.Int32Value deleteConversationOnKick = 10;
  openim.protobuf.Int32Value historyForNewMembers = 11;
  openim.protobuf.Int32Value readReceipts = 12;
  openim.protobuf.Int32Value memberPin = 13;
}

message GroupMemberFullInfo {
  string groupID = 1;
  string userID = 2;
  int32 roleLevel = 3;
  int64 joinTime = 4;
  string nickname = 5;
  string faceURL = 6;
  int32 appMangerLevel = 7; //if >0
  int32 joinSource = 8;
  string operatorUserID = 9;
  string ex = 10;
  int64 muteEndTime = 11;
  string inviterUserID = 12;
}

message PublicUserInfo {
  string userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
}

message UserInfo {
  string userID = 1;
  string nickname = 2;
  string faceURL = 3;
  string ex = 4;
  int64 createTime = 5;
  int32 appMangerLevel = 6;
  int32 globalRecvMsgOpt = 7;
}

message UserInfoWithEx {
  string userID = 1;
  openim.protobuf.StringValue nickname = 2;
  openim.protobuf.StringValue faceURL = 3;
  openim.protobuf.StringValue ex = 4;
  openim.protobuf.Int32Value globalRecvMsgOpt = 7;
}

message FriendInfo {
  string ownerUserID = 1;
  string remark = 2;
  int64 createTime = 3;
  UserInfo friendUser = 4;
  int32 addSource = 5;
  string operatorUserID = 6;
  string ex = 7;
