// AppSettings: the admin-configured knobs a client has to know about in
// order to behave correctly, delivered as one object rather than one
// endpoint per knob — so the next knob costs a field here instead of a
// round trip everywhere.
//
// Every field is `optional` so that a write can merge. An admin console
// one release behind the server sends only the fields it knows about,
// and the ones it has never heard of keep their values instead of being
// silently zeroed by their own absence.
//
// A read is the opposite: GetAppSettings always answers with every field
// present, defaults already applied, so no client ever has to carry its
// own copy of what a default is (and no two clients can disagree about
// it).
//
// Every duration field below reads the same way, and this is the only
// place that rule is written down:
//
//	 -1  no limit
//	  0  the action is disabled entirely
//	 >0  the window, in seconds
//
// One meaning per value across all of them, deliberately. The obvious
// alternative — 0 meaning "no limit" here and "disabled" there — puts
// two opposite readings on the same number in the same message, and the
// admin who has to remember which field is which will eventually get it
// wrong in the direction that turns a feature off.
message AppSettings {
  // How long after sending a message its author may still edit it.
  // Defaults to 300 (five minutes).
  optional int32 editWindowSeconds = 1;
  // The same, for recall. Defaults to -1, no limit: recall shipped long
  // before this setting existed and has never been time-bounded, so the
  // default has to keep meaning what the absence of a setting meant.
  optional int32 revokeWindowSeconds = 2;
}

// Pushed (constant.AppSettingsChangedNotification, 2400) to every user
// online when an admin saves. Carries the settings themselves rather
// than a "go and look" marker, so one push is the whole change.
message AppSettingsChangedTips {
  AppSettings settings = 1;
}

// GroupCreationDefaults: what a group's seven owner-configurable
// switches are set to at the moment it is created. Admin-configured,
// stored in MongoDB, applied by CreateGroup — no client gets a say, so
// the same policy holds whether a group was made from the web app, a
// phone, or a script calling the REST API directly.
//
// Every field is `optional` and absent means "no admin has ever chosen",
// which is what lets a write merge instead of replace and lets the
// built-in default change later for everyone who never had an opinion.
// See internal/rpc/group/creation_defaults.go for the built-ins.
//
// One encoding for all seven — 1 on, 2 off — rather than each field's
// own. The underlying GroupInfo fields disagree with each other
// (needVerification is a three-way enum, applyMemberFriend is 0/1, mute
// is a group *status* of all things), and an admin console that had to
// remember which is which would eventually set one the wrong way round.
// The translation into each field's native encoding happens in exactly
// one place, when a group is created.
message GroupCreationDefaults {
  // Mute the group from birth: only the owner and admins may send.
  // Becomes GroupInfo.status — constant.GroupStatusMuted or GroupOk.
  optional int32 muteAll = 1;
  // Invited people join only after an owner or admin approves. Becomes
  // needVerification — constant.AllNeedVerification, or
  // ApplyNeedVerificationInviteDirectly when off.
  optional int32 needVerification = 2;
  // Members can't add each other as friends from this group. Becomes
  // applyMemberFriend, which is 1 prohibited / 0 allowed.
  optional int32 applyMemberFriend = 3;
  // The four below map straight onto their GroupInfo fields, which
  // already read 1 on / 2 off (constant.GroupSettingOn / Off). A
  // created group is never left on 0: unset there means "ask someone
  // else what the default is", and this message *is* that someone.
  optional int32 deleteConversationOnKick = 4;
  optional int32 historyForNewMembers = 5;
  optional int32 readReceipts = 6;
  optional int32 memberPin = 7;
}

// Pushed (constant.MsgEditNotification, 2104) to a conversation after
// its author edits one of their messages.
//
// Carries the new content rather than a "go and refetch" marker, so a
// client that has the message on screen replaces it in place. The
// content is the encoded payload for contentType, exactly as it is
// stored — which is also why contentType travels with it: editing a
// plain text message so that it mentions someone turns it from Text into
// AtText, and a client that assumed the type had not changed would
// render the new payload with the old codec.
message EditMsgTips {
  string conversationID = 1;
  int64 seq = 2;
  string clientMsgID = 3;
  string editorUserID = 4;
  int32 sessionType = 5;
  int32 contentType = 6;
  string content = 7;
  int64 editTime = 8;
}
